context:
  version: "1.3.1"

package:
  name: orbit-nrel
  version: ${{ version }}


source:
  - url: https://pypi.org/packages/source/o/orbit-nrel/orbit_nrel-${{ version }}.tar.gz
    sha256: c94a707fd936821b517afb5b69346c3bb232bf26e241321e255df6257167f317

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . --no-deps --no-build-isolation
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - simpy
    - marmot-agents >=0.2.5
    - scipy
    - pandas
    - pyyaml
    - python-benedict
    - statsmodels
    - matplotlib

tests:
  - script:
      - pytest -n auto -vvv
    requirements:
      run:
        - pytest
        - pytest-cov
        - pytest-xdist
        - python ${{ python_min }}.*
    files:
      source:
        - .

about:
  homepage: https://github.com/WISDEM/ORBIT
  summary: Offshore Renewables Balance of system and Installation Tool

  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - julian-belina
